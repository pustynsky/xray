name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: MCP setup (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test local MCP setup and legacy migration (PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          & .\scripts\test-mcp-setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\test-detect-extensions.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\test-setup-dependencies.ps1
          exit $LASTEXITCODE
      - name: Test local MCP setup and legacy migration (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          & .\scripts\test-mcp-setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\test-detect-extensions.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\test-setup-dependencies.ps1
          exit $LASTEXITCODE

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tests in src/git/* and src/mcp/handlers/git_handler_tests.rs run
          # against the actual workspace repo (`.`) and require full history
          # (HEAD~1, file_history, branch detection). Default shallow clone
          # (fetch-depth: 1) leaves the working copy in detached HEAD with no
          # parent commits, so those tests fail in CI but pass locally.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
      - name: Test user MCP setup (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\scripts\test-mcp-setup.ps1 -UserMcpOnly -XrayBinary .\target\debug\xray.exe
          exit $LASTEXITCODE
      - name: Test user MCP setup (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\scripts\test-mcp-setup.ps1 -UserMcpOnly -XrayBinary .\target\debug\xray.exe
          exit $LASTEXITCODE

  feature-matrix:
    name: Feature matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--all-features"
          - "--no-default-features"
          - "--no-default-features --features lang-csharp"
          - "--no-default-features --features lang-typescript"
          - "--no-default-features --features lang-rust"
          - "--no-default-features --features lang-xml"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
      # Clippy is NOT run here yet: several `pub(crate)` helpers in
      # `mcp/handlers/callers.rs` and a `#[cfg(test)]` helper in
      # `definitions/incremental.rs` surface as `dead_code` / `unused_imports`
      # when language-parser features are turned off in isolation. Re-enable
      # this step (`cargo clippy --workspace --all-targets ${{ matrix.features }}
      # --locked -- -D warnings`) after gating those items with `#[cfg(...)]`.
      - name: cargo check ${{ matrix.features }}
        run: cargo check --workspace ${{ matrix.features }} --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit --deny warnings
        # RUSTSEC-2025-0141 (bincode 1.3.3 unmaintained) is tracked as MAJOR-10.
        # Migration to bincode 2 or postcard requires a breaking on-disk format bump
        # and is scheduled as a separate user story.
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0141

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
